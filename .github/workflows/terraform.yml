# ─── Terraform CI/CD — EchoRoom Infrastructure ─────────────────────────────────
# Runs on every PR against main:
#   - terraform fmt -check
#   - terraform validate
#   - terraform plan (dev)
#
# Runs on push to main (after merge):
#   - terraform apply (dev)
#   - terraform plan (prod) — manual approval required for prod apply

name: "Terraform"

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  pull-requests: write

env:
  TF_ROOT: infra/terraform
  TF_VERSION: "1.5.0"

jobs:
  validate:
    name: Validate & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive
        continue-on-error: false

      - name: Terraform Init (dev)
        working-directory: ${{ env.TF_ROOT }}/envs/dev
        run: |
          terraform init \
            -backend=false \
            -input=false

      - name: Terraform Validate (dev)
        working-directory: ${{ env.TF_ROOT }}/envs/dev
        run: terraform validate

  plan-dev:
    name: Plan (dev)
    needs: [validate]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}/envs/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (dev)
        id: init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/${{ env.TF_ROOT }}/backend.hcl" \
            -backend-config="key=dev/terraform.tfstate" \
            -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT }}

      - name: Terraform Plan (dev)
        id: plan
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -input=false \
            -no-color \
            -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT }}
          TF_VAR_aiven_api_token: ${{ secrets.AIVEN_API_TOKEN }}
          TF_VAR_upstash_email: ${{ secrets.UPSTASH_EMAIL }}
          TF_VAR_upstash_api_key: ${{ secrets.UPSTASH_API_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Terraform Plan (dev) 📋

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${{ steps.plan.outputs.stdout || 'No output' }}
            \`\`\`

            </details>

            *Pushed by: ${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  plan-staging:
    name: Plan (staging)
    needs: [validate]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}/envs/staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (staging)
        id: init-staging
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/${{ env.TF_ROOT }}/backend.hcl" \
            -backend-config="key=staging/terraform.tfstate" \
            -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT }}

      - name: Terraform Plan (staging)
        id: plan-staging
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -input=false \
            -no-color \
            -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT }}
          TF_VAR_aiven_api_token: ${{ secrets.AIVEN_API_TOKEN }}
          TF_VAR_upstash_email: ${{ secrets.UPSTASH_EMAIL }}
          TF_VAR_upstash_api_key: ${{ secrets.UPSTASH_API_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Terraform Plan (staging) 📋

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${{ steps.plan-staging.outputs.stdout || 'No output' }}
            \`\`\`

            </details>

            *Pushed by: ${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  apply-dev:
    name: Apply (dev)
    needs: [validate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}/envs/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (dev)
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/${{ env.TF_ROOT }}/backend.hcl" \
            -backend-config="key=dev/terraform.tfstate" \
            -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT }}

      - name: Terraform Apply (dev)
        run: |
          terraform apply \
            -var-file="terraform.tfvars" \
            -input=false \
            -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT }}
          TF_VAR_aiven_api_token: ${{ secrets.AIVEN_API_TOKEN }}
          TF_VAR_upstash_email: ${{ secrets.UPSTASH_EMAIL }}
          TF_VAR_upstash_api_key: ${{ secrets.UPSTASH_API_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  plan-prod:
    name: Plan (prod)
    needs: [validate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}/envs/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (prod)
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/${{ env.TF_ROOT }}/backend.hcl" \
            -backend-config="key=prod/terraform.tfstate" \
            -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT }}

      - name: Terraform Plan (prod)
        id: plan-prod
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -input=false \
            -no-color \
            -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT }}
          TF_VAR_aiven_api_token: ${{ secrets.AIVEN_API_TOKEN }}
          TF_VAR_upstash_email: ${{ secrets.UPSTASH_EMAIL }}
          TF_VAR_upstash_api_key: ${{ secrets.UPSTASH_API_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
